<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pauly Bruv Engraving - Custom Orders</title>
    <!-- Google Fonts: Noto Serif Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Main Navigation Header with Logo -->
    <header>
        <!-- Logo acts as the home link -->
        <a href="index.html" class="logo-link">
            <img src="assets/images/logo.png" alt="Pauly Bruv Engraving Logo" class="logo-img">
            <!-- Hidden h1 for accessibility/screen readers -->
            <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Pauly Bruv Engraving</h1>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="custom.html">Custom Orders</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Custom Engraving Submission Form -->
    <main>
        <div class="custom-order-container">
            <div class="custom-order-header">
                <h2>Request a Custom Engraving Quote</h2>
                <p>Have a custom logo, image, or tailored design requirement? Fill out the form below.</p>
            </div>

            <!-- Live MDF Street Sign Previewer (Placed inside Main) -->
            <div class="sign-preview-wrapper">
                <h3>Live Street Sign Preview</h3>
                <div id="mdf-sign-mockup" class="mdf-mockup black-base-white-text">
                    <div class="sign-border">
                        <span id="preview-text-display">YOUR TEXT HERE</span>
                    </div>
                </div>

                <!-- Finish Style Toggles -->
                <div class="preview-controls">
                    <label>Color Options:</label>
                    <button type="button" class="finish-btn active" onclick="setFinish('black-base-white-text')">Black Sign / White Text</button>
                    <button type="button" class="finish-btn" onclick="setFinish('white-base-black-text')">White Sign / Black Text</button>
                </div>
            </div>

            <!-- Custom Quote Form -->
            <form action="/submit-quote" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="custom-text-input">Custom Sign Text (Live Preview Above):</label>
                    <input type="text" id="custom-text-input" name="custom_text" class="form-control" placeholder="e.g. ST ANDREW'S WAY B9">
                </div>

                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="material">Preferred Material:</label>
                    <select id="material" name="material" class="form-control">
                        <option value="mdf">Layered MDF</option>
                        <option value="slate">Natural Slate</option>
                        <option value="wood">Organic Wood / Plywood</option>
                        <option value="other">Other / Not Sure</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="description">Project Description & Dimensions:</label>
                    <textarea id="description" name="description" class="form-control" placeholder="Describe text, layout, sizing..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="artwork">Upload Custom Design/Logo (PNG, JPG, SVG):</label>
                    <div class="file-upload-zone">
                        <label for="artwork" style="cursor:pointer; color: var(--text-secondary);">Click to upload or drag and drop your file here</label>
                        <input type="file" id="artwork" name="artwork" accept=".png, .jpg, .jpeg, .svg">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Submit Quote Request</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Pauly Bruv Engraving. All rights reserved.</p>
    </footer>

    <!-- App JavaScript -->
    <script src="assets/js/app.js"></script>

</body>
</html>
